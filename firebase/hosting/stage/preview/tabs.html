<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs preview</title>
<style>
  body { margin: 0; background: #f4f1ea; font-family: system-ui, sans-serif; }
  .grid { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; }
  .panel { width: 420px; max-width: 100%; background: #e8e3d8; border-radius: 16px; overflow: hidden; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
  import data from '../../src/_data/homepage.json'
  const lang = new URLSearchParams(location.search).get('lang') || 'pt'
  const only = new URLSearchParams(location.search).get('only')
  const grid = document.getElementById('grid')
  for (const st of data[lang].workflow.stages) {
    if (only && st.scene.kind !== only) continue
    const p = document.createElement('div'); p.className = 'panel'
    const h = document.createElement('div'); h.dataset.stage = 'tab'; h.dataset.icon = '/@fs/Users/rafaeldl/Projetos/praticOSopen/.claude/worktrees/site-stageshow/firebase/hosting/src/assets/images/logo-96.png'
    const s = document.createElement('script'); s.type = 'application/json'; s.textContent = JSON.stringify(st.scene)
    h.append(s); p.append(h); grid.append(p)
  }
  await import('../scenes/tabs/mount.tsx')
</script>
</body>
</html>
