# Java logging for the Firestore emulator in the E2E run (e2e/run.mjs, JAVA_TOOL_OPTIONS).
# A browser closed by a test leaves its listen channel on the emulator (the
# board's live query gets ~100 messages per write), and every message it can no
# longer queue logs two warnings. Over the suite that was millions of lines
# through the Firebase CLI, which slowed everything and failed the end of the run.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = ALL
com.google.net.webchannel.level = SEVERE
com.google.cloud.datastore.emulator.firestore.webchannel.level = SEVERE
