# Java logging for the Firestore emulator in the E2E run (e2e/run.mjs, JAVA_TOOL_OPTIONS).
# A page that leaves with live listeners leaves its channel on the emulator, and
# every message the channel can no longer queue logs warnings. e2e/test.ts stops
# the listeners first (1.3 million lines down to ~20 thousand a run); this
# keeps what is left from slowing the Firebase CLI.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = ALL
com.google.net.webchannel.level = SEVERE
com.google.cloud.datastore.emulator.firestore.webchannel.level = SEVERE
