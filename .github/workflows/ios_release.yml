name: Release iOS
run-name: "Release iOS ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags:
      - 'v*-rc'  # Only trigger on RC tags
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0-rc)'
        required: false
        type: string

# Only one iOS release at a time - cancel previous if new one starts
concurrency:
  group: ios-release
  cancel-in-progress: true

jobs:
  ios:
    # macos-26: imagem com Xcode 26 (a Apple exige o SDK do iOS 26 para upload)
    runs-on: macos-26

    permissions:
      contents: write

    env:
      BUNDLE_ID: br.com.rafsoft.praticos

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      # Determine which tag to use (input takes priority over ref)
      - name: Determine tag
        id: get_tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "📌 Using tag: $TAG"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.get_tag.outputs.tag }}

      # Extract version from tag
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          # Remove 'v' prefix and '-rc' suffix
          VERSION="${TAG#v}"
          VERSION="${VERSION%-rc}"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION from tag: $TAG"

      # Versao do Flutter vem do .fvmrc — fonte unica para CI e ambiente local
      - name: Resolve Flutter version
        id: flutter_version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      # Flutter SDK
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true # Ativa o cache do SDK

      - name: Cache Pub deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter deps
        run: flutter pub get

      # Versao do Xcode vem do .xcode-version — fonte unica para release e build check.
      # A Apple so aceita upload de builds feitos com o SDK do iOS 26 (Xcode 26+).
      - name: Resolve Xcode version
        id: xcode_version
        run: echo "version=$(tr -d '[:space:]' < .xcode-version)" >> "$GITHUB_OUTPUT"

      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ steps.xcode_version.outputs.version }}

      # Accept Xcode license
      - name: Accept Xcode license
        run: sudo xcodebuild -license accept

      # Download iOS Platform
      - name: Download iOS Platform
        run: xcodebuild -downloadPlatform iOS

      # Ruby + Bundler
      - name: Ruby (bundler cache)
        uses: ruby/setup-ruby@v1
        env:
          BUNDLE_GEMFILE: ios/Gemfile
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # 🔐 Certificado e provisioning profile vem do fastlane match, dentro da
      # lane (ver ios/fastlane/Matchfile). Nao ha mais .p12 nem .mobileprovision
      # em secrets: o match os baixa criptografados do repo de certificados.
      # Ver docs/IOS_CODE_SIGNING.md
      - name: Define team id
        shell: bash
        run: echo "DEVELOPMENT_TEAM=46AUA3GASK" >> $GITHUB_ENV

      # Deploy key somente leitura do repo de certificados. Falha aqui, em
      # segundos, se o bootstrap do match ainda nao foi feito.
      - name: Setup match access
        shell: bash
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD_CHECK: ${{ secrets.MATCH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MATCH_DEPLOY_KEY" ] || [ -z "$MATCH_PASSWORD_CHECK" ]; then
            echo "::error::Secrets do fastlane match ausentes (MATCH_GIT_PRIVATE_KEY / MATCH_PASSWORD). Rode ios/scripts/bootstrap_match.sh - ver docs/IOS_CODE_SIGNING.md"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "MATCH_GIT_PRIVATE_KEY=$HOME/.ssh/match_deploy_key" >> "$GITHUB_ENV"

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # 🧩 CocoaPods
      - name: Pod install
        working-directory: ios
        run: |
          if [ ! -d "Pods" ]; then
            bundle exec pod install --repo-update
          else
            bundle exec pod install
          fi

      # 📄 Adiciona o GoogleService-Info.plist
      - name: Add GoogleService-Info.plist
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          echo -n "${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > GoogleService-Info.plist
          # valida sintaxe do plist (opcional, ajuda a detectar secret errado)
          /usr/bin/plutil -lint GoogleService-Info.plist
          echo "GoogleService-Info.plist criado em ios/"

      # 🚀 Build + upload para TestFlight
      - name: Fastlane Beta (TestFlight)
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_PRIVATE_KEY }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          DEVELOPMENT_TEAM: ${{ env.DEVELOPMENT_TEAM }}
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
          # fastlane match: passphrase de descriptografia. O acesso ao repo de
          # certificados vem de MATCH_GIT_PRIVATE_KEY, definido no step "Setup match access"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          CI: "true"
        run: bundle exec fastlane beta

      # 📦 Find and rename IPA for upload
      - name: Prepare IPA for upload
        id: ipa
        run: |
          # Find the IPA file (Fastlane generates it in ios/ directory)
          IPA_PATH=$(find ios -name "*.ipa" -type f | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA file found!"
            exit 1
          fi

          echo "Found IPA: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      # 📦 Upload IPA to GitHub Release
      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Release ${{ steps.version.outputs.version_name }} (RC)"
          draft: false
          prerelease: true
          files: |
            ${{ steps.ipa.outputs.ipa_path }}
          body: |
            ## iOS Release Candidate

            **Version:** ${{ steps.version.outputs.version_name }}
            **Tag:** ${{ steps.get_tag.outputs.tag }}

            This is a release candidate deployed to TestFlight.

            To promote to production, use the "Promote Release" workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload fastlane logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            $HOME/Library/Logs/fastlane/fastlane.log
            ios/fastlane/report.xml
