name: Code Quality

# PR only: the pre-push hook (.githooks/pre-push) runs the same checks locally
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      # Casos de contrato: test/contract/contract_cases_test.dart lê estes JSON
      - 'docs/web-app/contract-cases/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/code_quality.yml'
      - '.fvmrc'

# A new push to the same PR cancels the run still going: only the last one counts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Versao do Flutter vem do .fvmrc — fonte unica para CI e ambiente local
      - name: Resolve Flutter version
        id: flutter_version
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test
