# .github/workflows/bot-sync.yml

name: Sync Bot Workspace

# Sync automatico desligado: a VM praticos-bot foi parada e o `make sync`
# falha sem ela. Para religar, restaurar o gatilho push abaixo:
#
#   push:
#     branches:
#       - master
#     paths:
#       - 'backend/bot/workspace/**'
#       - 'backend/bot/clawdbot.prod.json'
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRATICOS }}'

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: praticos

      - name: Sync bot workspace
        working-directory: backend/bot
        run: make sync SSH_KEY_FILE=
