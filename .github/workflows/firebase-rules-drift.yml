# .github/workflows/firebase-rules-drift.yml
#
# Daily check that the Firestore and Storage rules live in `praticos` are the
# same as firebase/firestore.rules and firebase/storage.rules on master.
# Fails (and GitHub emails the failure) when they differ, e.g. after a deploy
# by hand from another branch or a failed rules deploy.

name: Firestore/Storage Rules Drift

on:
  schedule:
    - cron: '17 11 * * *' # 08:17 in Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare production with master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRATICOS }}'

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Compare deployed rules
        run: .github/scripts/check-rules-drift.sh praticos
