# .github/workflows/firebase-hosting-deploy.yml

name: Deploy Website to Firebase Hosting

on:
  push:
    branches:
      - master  # Ou a branch que você usa como principal
    paths:
      - 'firebase/hosting/**' # Executa a action se houver mudanças na pasta do site
      - 'firebase/webapp/**' # App web servido em /web (docs/WEB_APP.md)
      - 'firebase/firebase.json' # Ou se mudar rewrites/headers/config do hosting

# Only the newest master matters: a new push cancels the running and pending
# deploys of older commits, and the newest one publishes everything (merges in
# sequence used to queue one deploy per merge).
concurrency:
  group: firebase-hosting-deploy-praticos
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            firebase/hosting/package-lock.json
            firebase/webapp/package-lock.json

      - name: Install dependencies
        working-directory: firebase/hosting
        run: npm ci

      - name: Build site
        working-directory: firebase/hosting
        run: npm run build

      # After the site: Eleventy writes hosting/public, the SPA goes to public/web.
      - name: Build web app
        working-directory: firebase/webapp
        run: |
          npm ci
          npm run build:hosting

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRATICOS }}'
          projectId: praticos
          channelId: live
          entryPoint: firebase
