name: Functions Check

# PR only: the pre-push hook (.githooks/pre-push) runs lint + tests locally
on:
  pull_request:
    paths:
      # Casos de contrato: src/__tests__/contract-cases.test.ts lê estes JSON
      - 'docs/web-app/contract-cases/**'
      # Tabela única dos planos (#722): cada lado compara com ela
      - 'docs/plans/**'
      - 'scripts/plan-table.mjs'
      - 'firebase/firestore.rules'
      - 'firebase/storage.rules'
      - 'firebase/firebase.test.json'
      - 'firebase/functions/**'
      - '.github/workflows/functions_check.yml'

# A new push to the same PR cancels the run still going: only the last one counts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Jest only transpiles, so sources and tests are type checked here
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  rules:
    name: Firestore Rules Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      # firebase-tools 15 requires JDK 21+ to run the Firestore emulator
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Install dependencies
        run: npm ci

      - name: Test rules
        run: npm run test:rules

      # Role × action matrix (Firestore + Storage), see docs/E2E_ROLES_TESTING.md
      - name: Test RBAC matrix
        run: npm run test:rbac
