name: Functions Check

on:
  push:
    branches-ignore: [ master ]
    paths:
      - 'firebase/functions/**'
      - '.github/workflows/functions_check.yml'
  pull_request:
    paths:
      - 'firebase/firestore.rules'
      - 'firebase/functions/**'
      - '.github/workflows/functions_check.yml'

jobs:
  check:
    name: Lint + Test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  rules:
    name: Firestore Rules Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json

      # firebase-tools 15 requires JDK 21+ to run the Firestore emulator
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v15

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Install dependencies
        run: npm ci

      - name: Test rules
        run: npm run test:rules
