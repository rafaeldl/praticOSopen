name: Parity Check

on:
  pull_request:
    paths:
      - 'lib/screens/**'
      - 'lib/routes.dart'
      - 'docs/web-app/parity-matrix.yaml'
      - 'scripts/check_parity_matrix.mjs'

permissions:
  contents: read

jobs:
  parity:
    name: Matriz de paridade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check parity matrix
        run: node scripts/check_parity_matrix.mjs
