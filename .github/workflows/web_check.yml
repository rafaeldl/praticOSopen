name: Web Check

on:
  pull_request:
    paths:
      - 'firebase/web/**'
      - '.github/workflows/web_check.yml'

jobs:
  check:
    name: Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/web

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firebase/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
