openapi: 3.0.3
info:
  title: PraticOS Integrations API
  description: |
    API de integrações do PraticOS para bot WhatsApp e integrações externas.

    ## Autenticação

    A API suporta três modos de autenticação:
    - **API Key**: Para integrações externas (Zapier, n8n, parceiros)
    - **Bot API Key**: Para o bot WhatsApp (Clawdbot)
    - **Bearer Token**: Para o app Flutter (Firebase ID Token)
  version: 1.0.0
  contact:
    name: PraticOS Support
    url: https://praticos.web.app
  license:
    name: Proprietary
    url: https://praticos.web.app/terms

servers:
  - url: https://southamerica-east1-praticos-app.cloudfunctions.net/api
    description: Production
  - url: http://localhost:5000/praticos-app/southamerica-east1/api
    description: Local Emulator

tags:
  - name: Auth
    description: Autenticação e tokens
  - name: Orders
    description: Ordens de serviço
  - name: Customers
    description: Clientes
  - name: Devices
    description: Dispositivos
  - name: Services
    description: Catálogo de serviços
  - name: Products
    description: Catálogo de produtos
  - name: Company
    description: Empresa e membros
  - name: Analytics
    description: Dashboard e relatórios
  - name: Bot Link
    description: Vinculação WhatsApp
  - name: Bot Invite
    description: Convites de colaborador
  - name: Bot Search
    description: Busca inteligente
  - name: Bot Summary
    description: Resumos formatados
  - name: App Orders
    description: OS pelo app web (itens, dinheiro, situação, parada). Ver docs/WEB_API.md
  - name: App Payments
    description: Receber de um cliente com várias OS e cobrança Asaas de várias OS (app Flutter)
  - name: App NFS-e
    description: Nota fiscal de serviço pelo Asaas, atrás da flag nfseEnabled (docs/NFSE_ASAAS.md)

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for external integrations
    ApiSecret:
      type: apiKey
      in: header
      name: X-API-Secret
      description: API Secret (required with API Key)
    BotApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Bot API Key for Clawdbot
    WhatsAppNumber:
      type: apiKey
      in: header
      name: X-WhatsApp-Number
      description: WhatsApp number in E.164 format
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID Token

  parameters:
    AppCustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
    AppCompanyId:
      name: X-Company-Id
      in: header
      required: true
      schema:
        type: string
    AppOrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
    AppItemId:
      name: itemId
      in: path
      required: true
      description: '`id` da linha em GET /v1/app/orders/{orderId} (linhas antigas: id derivado `legacy_…`)'
      schema:
        type: string
    AppTransactionId:
      name: transactionId
      in: path
      required: true
      description: '`id` da transação em GET /v1/app/orders/{orderId} (antigas: `legacy_…`)'
      schema:
        type: string
    AppReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string

  responses:
    AppOrderWritten:
      description: A OS depois da escrita (sem valores para quem não tem viewPrices)
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              data:
                type: object
                properties:
                  itemId: { type: string }
                  order: { $ref: '#/components/schemas/AppOrder' }

  schemas:
    ExpectedUpdatedAt:
      type: string
      format: date-time
      description: '`updatedAt` que o cliente viu. Outro valor na OS → 409 ORDER_CHANGED, nada gravado.'
    ReceiptFile:
      type: object
      required: [url, storagePath, contentType]
      properties:
        url: { type: string, format: uri }
        storagePath: { type: string }
        fileName: { type: string }
        contentType: { type: string, description: image/* ou application/pdf }
    AppOrderLine:
      type: object
      properties:
        id: { type: string }
        service: { type: object, description: 'id, name, photo e value (só com viewPrices)' }
        product: { type: object, description: 'id, name, photo e value (só com viewPrices)' }
        description: { type: string }
        quantity: { type: integer }
        deviceId: { type: string }
        value: { type: number, nullable: true, description: Só com viewPrices. null = sem valor }
        total: { type: number, nullable: true, description: Total da linha do produto, só com viewPrices }
    AppOrderSummary:
      type: object
      properties:
        id: { type: string }
        number: { type: integer }
        customer: { type: object }
        device: { type: object }
        status: { type: string }
        onHold: { type: object }
        assignedTo: { type: object }
        dueDate: { type: string, format: date-time }
        scheduledDate: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        total: { type: number, description: Só com viewPrices }
        paidAmount: { type: number, description: Só com viewPrices }
        payment: { type: string, nullable: true, enum: [paid, unpaid], description: Só com viewPrices }
    AppOrder:
      type: object
      properties:
        id: { type: string }
        number: { type: integer }
        customer: { type: object }
        device: { type: object }
        devices: { type: array, items: { type: object } }
        services: { type: array, items: { $ref: '#/components/schemas/AppOrderLine' } }
        products: { type: array, items: { $ref: '#/components/schemas/AppOrderLine' } }
        status: { type: string }
        onHold: { type: object, properties: { reason: { type: string }, note: { type: string }, since: { type: string } } }
        assignedTo: { type: object, nullable: true }
        dueDate: { type: string, format: date-time, nullable: true }
        scheduledDate: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, description: Mandar de volta em expectedUpdatedAt }
        total: { type: number, description: Só com viewPrices }
        discount: { type: number, description: Só com viewPrices }
        paidAmount: { type: number, description: Só com viewPrices }
        remainingBalance: { type: number, description: Só com viewPrices }
        payment: { type: string, nullable: true, description: Só com viewPrices }
        transactions: { type: array, items: { type: object }, description: Só com viewPrices }
        documents: { type: array, items: { type: object }, description: Comprovantes, só com viewPrices }
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean

    CustomerAggr:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string

    DeviceAggr:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serial:
          type: string

    OrderSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        customer:
          $ref: '#/components/schemas/CustomerAggr'
        device:
          $ref: '#/components/schemas/DeviceAggr'
        status:
          type: string
          enum: [quote, approved, progress, done, canceled]
        total:
          type: number
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            services:
              type: array
              items:
                type: object
                properties:
                  service:
                    type: object
                  value:
                    type: number
                  description:
                    type: string
            products:
              type: array
              items:
                type: object
                properties:
                  product:
                    type: object
                  value:
                    type: number
                  quantity:
                    type: integer
            discount:
              type: number
            paidAmount:
              type: number
            remainingBalance:
              type: number

    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        createdAt:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        serial:
          type: string
        manufacturer:
          type: string
        category:
          type: string
        description:
          type: string

    Service:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
        photo:
          type: string

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
        photo:
          type: string

    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        segment:
          type: string
        country:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        logo:
          type: string

    CompanyMember:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin, supervisor, manager, consultant, technician]
        linkedChannels:
          type: array
          items:
            type: string

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  version:
                    type: string

  /api/v1/auth/token:
    post:
      tags: [Auth]
      summary: Generate access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [apiKey, apiSecret]
              properties:
                apiKey:
                  type: string
                apiSecret:
                  type: string
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      expiresIn:
                        type: integer
                      companyId:
                        type: string

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [quote, approved, progress, done, canceled]
        - name: customerId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderSummary'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [Orders]
      summary: Create order
      security:
        - ApiKey: []
          ApiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId:
                  type: string
                deviceId:
                  type: string
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      serviceId:
                        type: string
                      value:
                        type: number
                      description:
                        type: string
                products:
                  type: array
                  items:
                    type: object
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                      value:
                        type: number
                dueDate:
                  type: string
                  format: date-time
                status:
                  type: string
                  enum: [quote]
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      number:
                        type: integer
                      status:
                        type: string

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OrderDetail'

    patch:
      tags: [Orders]
      summary: Update order
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [quote, approved, progress, done, canceled]
                dueDate:
                  type: string
                  format: date-time
                assignedTo:
                  type: string
      responses:
        '200':
          description: Order updated

  /api/v1/orders/{id}/payments:
    post:
      tags: [Orders]
      summary: Add payment to order
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                type:
                  type: string
                  enum: [payment, discount]
                  default: payment
                description:
                  type: string
      responses:
        '200':
          description: Payment added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      transactionId:
                        type: string
                      paidAmount:
                        type: number
                      remainingBalance:
                        type: number
                      isFullyPaid:
                        type: boolean

  /api/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: phone
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of customers

    post:
      tags: [Customers]
      summary: Create customer
      security:
        - ApiKey: []
          ApiSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                address:
                  type: string
      responses:
        '201':
          description: Customer created

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Get analytics summary
      security:
        - ApiKey: []
          ApiSecret: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, year, custom]
            default: today
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Analytics summary

  /api/v1/analytics/pending:
    get:
      tags: [Analytics]
      summary: Get pending items
      security:
        - ApiKey: []
          ApiSecret: []
      responses:
        '200':
          description: Pending items

  /api/bot/link:
    post:
      tags: [Bot Link]
      summary: Link WhatsApp number
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, whatsappNumber]
              properties:
                token:
                  type: string
                whatsappNumber:
                  type: string
      responses:
        '200':
          description: WhatsApp linked

    delete:
      tags: [Bot Link]
      summary: Unlink WhatsApp number
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      responses:
        '200':
          description: WhatsApp unlinked

  /api/bot/link/context:
    get:
      tags: [Bot Link]
      summary: Get user context
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      responses:
        '200':
          description: User context

  /api/bot/invite/create:
    post:
      tags: [Bot Invite]
      summary: Create collaborator invite
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorName, role]
              properties:
                collaboratorName:
                  type: string
                role:
                  type: string
                  enum: [technician, consultant, supervisor, manager]
      responses:
        '201':
          description: Invite created

  /api/bot/invite/accept:
    post:
      tags: [Bot Invite]
      summary: Accept invite
      security:
        - BotApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode, whatsappNumber]
              properties:
                inviteCode:
                  type: string
                whatsappNumber:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Invite accepted

  /api/bot/customers/search:
    get:
      tags: [Bot Search]
      summary: Search customers
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/bot/orders/quick:
    post:
      tags: [Bot Search]
      summary: Quick order creation
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, deviceName, problem]
              properties:
                customerName:
                  type: string
                customerPhone:
                  type: string
                deviceName:
                  type: string
                deviceSerial:
                  type: string
                problem:
                  type: string
                estimatedValue:
                  type: number
                dueDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Order created

  /api/bot/summary/today:
    get:
      tags: [Bot Summary]
      summary: Get today summary
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      responses:
        '200':
          description: Today summary with formatted message

  /api/bot/summary/pending:
    get:
      tags: [Bot Summary]
      summary: Get pending summary
      security:
        - BotApiKey: []
        - WhatsAppNumber: []
      responses:
        '200':
          description: Pending items with formatted message

  # ─── App Orders (app web; docs/WEB_API.md) ────────────────────────────────
  /v1/app/orders:
    get:
      tags: [App Orders]
      summary: Listar OS (todas, ou as que o usuário criou)
      description: |
        Quem tem `viewAllOrders` vê todas; consultor e técnico, as que criaram. Paginação por
        cursor (`pagination.nextCursor`). Sem `viewPrices` nenhum valor sai. Combinação de filtro
        e ordem sem índice no Firestore → 400 UNSUPPORTED_QUERY.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string }, description: Id da última OS da página anterior }
        - { name: status, in: query, schema: { type: string }, description: 'Uma ou várias situações separadas por vírgula (quote,approved,progress,done,canceled)' }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, updatedAt, number, dueDate, scheduledDate], default: createdAt } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: deviceId, in: query, schema: { type: string } }
        - { name: assignedTo, in: query, schema: { type: string } }
        - { name: startDate, in: query, schema: { type: string, format: date-time }, description: Só com sort=createdAt }
        - { name: endDate, in: query, schema: { type: string, format: date-time }, description: Só com sort=createdAt }
      responses:
        '200':
          description: Página de OS
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/AppOrderSummary' } }
                  pagination:
                    type: object
                    properties:
                      limit: { type: integer }
                      total: { type: integer, description: Só na primeira página }
                      hasMore: { type: boolean }
                      nextCursor: { type: string, nullable: true }
        '400': { description: VALIDATION_ERROR / INVALID_CURSOR / UNSUPPORTED_QUERY }
        '403': { description: INSUFFICIENT_PERMISSIONS }

  /v1/app/orders/{orderId}:
    get:
      tags: [App Orders]
      summary: Abrir uma OS
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200':
          description: OS (sem valores para quem não tem viewPrices)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AppOrder' }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '404': { description: NOT_FOUND }
    patch:
      tags: [App Orders]
      summary: Mudar situação, datas e responsável
      description: |
        Situação: fluxo por papel (status-transitions.json). Datas: supervisor e técnico só em
        orçamento. Responsável: `assignOrder`, nome lido do membro. `null` limpa. Não grava `done`.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [quote, approved, progress, done, canceled] }
                dueDate: { type: string, format: date-time, nullable: true }
                scheduledDate: { type: string, format: date-time, nullable: true }
                assignedTo: { type: string, nullable: true, description: Id do membro }
                expectedUpdatedAt: { $ref: '#/components/schemas/ExpectedUpdatedAt' }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '400': { description: VALIDATION_ERROR / INVALID_ASSIGNEE }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '404': { description: NOT_FOUND }
        '409': { description: ORDER_CHANGED }
    delete:
      tags: [App Orders]
      summary: Apagar a OS
      description: |
        Mesma regra de order-delete.json. Recusa com nota ativa ou cobrança de várias OS aberta;
        cancela a cobrança aberta desta OS antes de apagar; leva subcoleções, arquivos e links.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { description: Apagada }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '404': { description: NOT_FOUND }
        '409': { description: ORDER_HAS_INVOICE / CUSTOMER_CHARGE_OPEN / INSTALLMENTS_IN_PROGRESS }
        '502': { description: ASAAS_UNAVAILABLE }

  /v1/app/orders/{orderId}/items:
    post:
      tags: [App Orders]
      summary: Pôr serviço ou produto do catálogo
      description: Total calculado no servidor. Valor ou total da linha próprio exige `editPrices`. `value null` = sem valor.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, catalogId]
              properties:
                kind: { type: string, enum: [service, product] }
                catalogId: { type: string }
                description: { type: string, maxLength: 500 }
                value: { type: number, nullable: true }
                quantity: { type: integer, minimum: 1, description: Só produto }
                total: { type: number, nullable: true, description: Total da linha do produto }
                deviceId: { type: string, nullable: true, description: Aparelho que está na OS }
                expectedUpdatedAt: { $ref: '#/components/schemas/ExpectedUpdatedAt' }
      responses:
        '201': { $ref: '#/components/responses/AppOrderWritten' }
        '400': { description: VALIDATION_ERROR / INVALID_DEVICE }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '404': { description: NOT_FOUND }
        '409': { description: ORDER_CHANGED }

  /v1/app/orders/{orderId}/items/{itemId}:
    patch:
      tags: [App Orders]
      summary: Mudar um item
      description: Só a observação, quem vê a OS; o resto, quem edita os campos principais.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppItemId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                value: { type: number, nullable: true }
                quantity: { type: integer, minimum: 1 }
                total: { type: number, nullable: true }
                deviceId: { type: string, nullable: true }
                expectedUpdatedAt: { $ref: '#/components/schemas/ExpectedUpdatedAt' }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '404': { description: NOT_FOUND / ITEM_NOT_FOUND }
        '409': { description: ORDER_CHANGED }
    delete:
      tags: [App Orders]
      summary: Tirar um item
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppItemId'
        - $ref: '#/components/parameters/AppCompanyId'
        - { name: expectedUpdatedAt, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '404': { description: NOT_FOUND / ITEM_NOT_FOUND }
        '409': { description: ORDER_CHANGED }

  /v1/app/orders/{orderId}/payments:
    post:
      tags: [App Orders]
      summary: Receber
      description: |
        Quem recebe: dono, admin e gerente; consultor nas OS que criou (canReceiveOnOrder).
        Desconto vai em /discounts. Comprovante em `tenants/{companyId}/orders/{orderId}/`.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0.01 }
                description: { type: string }
                paidAt: { type: string, format: date-time }
                paymentMethod: { type: string, enum: [pix, cash, card, other] }
                receiptFile: { $ref: '#/components/schemas/ReceiptFile' }
      responses:
        '200': { description: 'transactionId, paidAmount, remainingBalance, isFullyPaid e a OS' }
        '400': { description: VALIDATION_ERROR / INVALID_FILE / INVALID_PAID_AT }
        '403': { description: INSUFFICIENT_PERMISSIONS }

  /v1/app/orders/{orderId}/payments/mark-paid:
    post:
      tags: [App Orders]
      summary: Marcar como paga (lança o que falta)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: string }
                paidAt: { type: string, format: date-time }
                paymentMethod: { type: string, enum: [pix, cash, card, other] }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '403': { description: INSUFFICIENT_PERMISSIONS }

  /v1/app/orders/{orderId}/payments/reset:
    post:
      tags: [App Orders]
      summary: Zerar pagamentos e descontos feitos à mão (os do Asaas ficam)
      description: Financeiro. OS com parte de recibo → 409 RECEIPT_SHARE (desfazer o recibo).
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '409': { description: RECEIPT_SHARE }

  /v1/app/orders/{orderId}/payments/{transactionId}:
    delete:
      tags: [App Orders]
      summary: Tirar um pagamento
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppTransactionId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '404': { description: TRANSACTION_NOT_FOUND }
        '409': { description: ASAAS_LOCKED / RECEIPT_SHARE }

  /v1/app/orders/{orderId}/payments/{transactionId}/receipt:
    put:
      tags: [App Orders]
      summary: Anexar ou trocar o comprovante de um pagamento
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppTransactionId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptFile]
              properties:
                receiptFile: { $ref: '#/components/schemas/ReceiptFile' }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '400': { description: INVALID_FILE }
        '409': { description: ASAAS_LOCKED / RECEIPT_SHARE }
    delete:
      tags: [App Orders]
      summary: Tirar o comprovante de um pagamento
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppTransactionId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }

  /v1/app/orders/{orderId}/discounts:
    post:
      tags: [App Orders]
      summary: Dar desconto (financeiro, até o que falta)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, minimum: 0.01 }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '400': { description: VALIDATION_ERROR (acima do que falta) }
        '403': { description: INSUFFICIENT_PERMISSIONS }
    delete:
      tags: [App Orders]
      summary: Tirar todo o desconto (também o que não tem transação)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }

  /v1/app/orders/{orderId}/discounts/{transactionId}:
    delete:
      tags: [App Orders]
      summary: Tirar um desconto
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppTransactionId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '404': { description: TRANSACTION_NOT_FOUND }

  /v1/app/orders/{orderId}/hold:
    post:
      tags: [App Orders]
      summary: Marcar como parada (docs/ORDER_ON_HOLD.md)
      description: Não consultor; só aprovada ou em andamento. Deixa comentário interno.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [part, customer, authorization, other] }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }
        '403': { description: INSUFFICIENT_PERMISSIONS }
        '409': { description: HOLD_NOT_ALLOWED }
    delete:
      tags: [App Orders]
      summary: Retomar
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppOrderId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { $ref: '#/components/responses/AppOrderWritten' }

  /v1/app/customers/{customerId}/open-orders:
    get:
      tags: [App Payments]
      summary: OS em aberto do cliente (número, quanto falta, data)
      description: |
        Só número, valor em aberto, data e se a OS é do próprio usuário. Mais antiga primeiro.
        Usado pelo consultor para "Outras OS de {cliente}". Quem recebe: owner, admin, manager
        ou consultor, com "Valores e cobrança" ligado.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200':
          description: OS em aberto
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        number: { type: integer, nullable: true }
                        open: { type: number }
                        createdAt: { type: string, nullable: true }
                        own: { type: boolean }
        '403': { description: FORBIDDEN }
        '404': { description: CUSTOMER_NOT_FOUND }

  /v1/app/customers/{customerId}/receipts:
    get:
      tags: [App Payments]
      summary: Recibos do cliente
      description: Ativos, mais novos primeiro. Financeiro vê todos; consultor, os que registrou.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { description: Lista de recibos }
        '403': { description: FORBIDDEN }
    post:
      tags: [App Payments]
      summary: Registrar recebimento em várias OS do cliente (inclui OS de outra pessoa)
      description: |
        Para o consultor que inclui OS que não criou. O servidor confere papel, empresa,
        cliente, OS que não é orçamento nem cancelada e valor até o que falta (por OS e no total),
        e grava numa transação só os campos de pagamento de cada OS e o recebimento
        (`companies/{cid}/receipts/{receiptId}`).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptId, paidAt, allocations]
              properties:
                receiptId: { type: string }
                paidAt: { type: string, format: date-time }
                allocations:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [orderId, amount]
                    properties:
                      orderId: { type: string }
                      amount: { type: number }
                receiptFile:
                  type: object
                  properties:
                    url: { type: string }
                    storagePath: { type: string }
                    fileName: { type: string }
                    contentType: { type: string }
      responses:
        '201': { description: Recebimento registrado }
        '400': { description: VALIDATION_ERROR / ORDER_NOT_OF_CUSTOMER / INVALID_PAID_AT / INVALID_FILE }
        '403': { description: FORBIDDEN }
        '404': { description: CUSTOMER_NOT_FOUND / ORDER_NOT_FOUND }
        '409': { description: ORDER_NOT_PAYABLE / VALUE_EXCEEDS_BALANCE / RECEIPT_EXISTS }

  /v1/app/customers/{customerId}/receipts/{receiptId}/cancel:
    post:
      tags: [App Payments]
      summary: Desfazer recibo
      description: |
        Tira a parte de cada OS (como tirar um pagamento) e marca o recibo `canceled`. O arquivo
        do comprovante fica. Financeiro ou quem registrou. Recibo do Asaas → 409 ASAAS_LOCKED.
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppReceiptId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { description: Recibo desfeito }
        '403': { description: FORBIDDEN }
        '404': { description: RECEIPT_NOT_FOUND }
        '409': { description: ASAAS_LOCKED }

  /v1/app/customers/{customerId}/receipts/{receiptId}/file:
    put:
      tags: [App Payments]
      summary: Anexar comprovante ao recibo (em todas as OS dele)
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppReceiptId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiptFile]
              properties:
                receiptFile: { $ref: '#/components/schemas/ReceiptFile' }
      responses:
        '200': { description: Recibo com comprovante }
        '400': { description: 'INVALID_FILE (fora de tenants/{companyId}/receipts/{receiptId}/)' }
        '403': { description: FORBIDDEN }
        '409': { description: RECEIPT_CANCELED / ASAAS_LOCKED }
    delete:
      tags: [App Payments]
      summary: Tirar o comprovante do recibo
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppReceiptId'
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { description: Recibo sem comprovante }

  /v1/app/customers/{customerId}/charges:
    post:
      tags: [App Payments]
      summary: Uma cobrança Asaas para várias OS do cliente
      description: |
        Valor até o que falta nas OS escolhidas, repartido da mais antiga para a mais nova.
        Cancela antes as cobranças abertas de uma OS só dessas OS e a cobrança de várias OS
        anterior do cliente. `externalReference` no Asaas = `{companyId}:cc:{chargeId}`.
        Permissão `manage:payments`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderIds, value]
              properties:
                orderIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string }
                value: { type: number }
                dueDate: { type: string, example: '2026-10-18' }
                customerTaxId: { type: string }
      responses:
        '201': { description: Cobrança criada (sem os campos internos do servidor) }
        '400': { description: VALIDATION_ERROR / INVALID_VALUE / ORDER_NOT_OF_CUSTOMER / TAX_ID_REQUIRED / INVALID_TAX_ID }
        '403': { description: FORBIDDEN / ASAAS_NOT_ENABLED }
        '409': { description: ASAAS_NOT_CONNECTED / ORDER_NOT_PAYABLE / INSTALLMENTS_IN_PROGRESS }
        '502': { description: ASAAS_UNAVAILABLE }

  /v1/app/customers/{customerId}/charges/{chargeId}:
    delete:
      tags: [App Payments]
      summary: Cancelar a cobrança de várias OS
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCustomerId'
        - $ref: '#/components/parameters/AppCompanyId'
        - name: chargeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cobrança cancelada }
        '404': { description: CHARGE_NOT_FOUND }
        '409': { description: CHARGE_NOT_OPEN }

  /v1/app/nfse/setup:
    get:
      tags: [App NFS-e]
      summary: O que falta para emitir notas
      description: |
        Configuração fiscal do Asaas, regras da cidade e serviço padrão, com `missing`
        (`fiscalInfo`, `cityAccess`, `service`). Atualiza `nfseReady` em `settings/payments`.
        Só dono e admin.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
      responses:
        '200': { description: '{ ready, missing, fiscalInfo, municipalOptions, service }' }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }
        '409': { description: ASAAS_NOT_CONNECTED }

  /v1/app/nfse/setup/fiscal-info:
    post:
      tags: [App NFS-e]
      summary: Salvar a configuração fiscal no Asaas (POST /v3/fiscalInfo)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, simplesNacional]
              properties:
                email: { type: string }
                simplesNacional: { type: boolean }
                municipalInscription: { type: string }
                cnae: { type: string }
                specialTaxRegime: { type: string }
                serviceListItem: { type: string }
                rpsSerie: { type: string }
                rpsNumber: { type: integer }
                loteNumber: { type: integer }
      responses:
        '200': { description: Situação da configuração (como GET /setup) }
        '400': { description: VALIDATION_ERROR / ASAAS_VALIDATION_ERROR }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }

  /v1/app/nfse/setup/municipal-services:
    get:
      tags: [App NFS-e]
      summary: Serviços municipais da cidade (GET /v3/fiscalInfo/services)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { description: Lista de serviços municipais do Asaas }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }

  /v1/app/nfse/setup/service:
    put:
      tags: [App NFS-e]
      summary: Serviço padrão das notas (settings/nfse)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [municipalServiceName, taxes]
              description: municipalServiceId ou municipalServiceCode é obrigatório
              properties:
                municipalServiceId: { type: string, nullable: true }
                municipalServiceCode: { type: string, nullable: true }
                municipalServiceName: { type: string }
                taxes:
                  type: object
                  required: [retainIss, iss, pis, cofins, csll, inss, ir]
                  properties:
                    retainIss: { type: boolean }
                    iss: { type: number, minimum: 0, maximum: 100 }
                    pis: { type: number }
                    cofins: { type: number }
                    csll: { type: number }
                    inss: { type: number }
                    ir: { type: number }
                descriptionTemplate:
                  type: string
                  description: 'Marcadores {servicos} e {os}'
      responses:
        '200': { description: Situação da configuração (como GET /setup) }
        '400': { description: VALIDATION_ERROR / INVALID_FISCAL_INFO }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }

  /v1/app/nfse/invoices/preview:
    post:
      tags: [App NFS-e]
      summary: Prévia da nota de uma ou mais OS
      description: |
        Valor = serviços − desconto × serviços / (serviços + peças), somado por OS.
        Permissão `manage:payments`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderIds]
              properties:
                orderIds: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                customerId: { type: string }
      responses:
        '200': { description: '{ value, orders, hasProducts, serviceDescription, observations, effectiveDate, customer { id, name, hasTaxId }, invoicedOrders, municipalServiceName }' }
        '400': { description: VALIDATION_ERROR / NO_SERVICES / ORDER_NOT_OF_CUSTOMER / NFSE_ORDER_NOT_ALLOWED }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }
        '409': { description: NFSE_NOT_READY / NFSE_SETUP_NEEDED / NFSE_RECONNECT_NEEDED }

  /v1/app/nfse/invoices:
    post:
      tags: [App NFS-e]
      summary: Emitir uma nota para uma ou mais OS do mesmo cliente
      description: |
        Nota avulsa no Asaas (POST /v3/invoices com `customer`, sem `payment`),
        `externalReference` = `{companyId}:nf:{invoiceId}`. Uma nota ativa por OS.
        Grava `companies/{cid}/invoices/{id}`. Permissão `manage:payments`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderIds]
              properties:
                orderIds: { type: array, minItems: 1, maxItems: 50, items: { type: string } }
                customerId: { type: string }
                serviceDescription: { type: string, maxLength: 2000 }
                effectiveDate: { type: string, example: '2026-10-15' }
                customerTaxId: { type: string }
      responses:
        '201': { description: Nota criada (status scheduled, ou error se o Asaas recusou) }
        '400': { description: VALIDATION_ERROR / NO_SERVICES / TAX_ID_REQUIRED / INVALID_TAX_ID / INVALID_EFFECTIVE_DATE / ASAAS_VALIDATION_ERROR }
        '403': { description: FORBIDDEN / NFSE_NOT_ENABLED }
        '409': { description: ASAAS_NOT_CONNECTED / NFSE_NOT_READY / NFSE_SETUP_NEEDED / NFSE_RECONNECT_NEEDED / ORDER_HAS_INVOICE }
        '502': { description: ASAAS_UNAVAILABLE }

  /v1/app/nfse/invoices/{invoiceId}/cancel:
    post:
      tags: [App NFS-e]
      summary: Cancelar a nota
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppCompanyId'
        - name: invoiceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                onlyOnAsaas:
                  type: boolean
                  description: Só no Asaas, para cidade que não cancela pela integração
      responses:
        '200': { description: Nota com o novo status }
        '404': { description: INVOICE_NOT_FOUND }
        '409': { description: INVOICE_NOT_CANCELABLE / CANCEL_NOT_SUPPORTED / INVOICE_OTHER_ACCOUNT / NFSE_RECONNECT_NEEDED }
