# Matriz de paridade do app web do PraticOS.
# Fonte: código do app em lib/ (RolePermissions, AuthorizationService, telas). Gerada na descoberta; manter à mão.
# Uma linha por par (tela, ação). Todo arquivo de lib/screens/ tem ao menos uma linha.
# Checagem: node scripts/check_parity_matrix.mjs (roda no CI em parity_check.yml).
# Campos:
#   id: estável e único. screen: arquivo. route: rota nomeada, quando há.
#   roles: papéis reais (owner, admin, supervisor, manager, consultant, technician); 'owner' é gravado e lido como admin.
#          Pseudo-papéis: anonymous (sem login), signed_in_no_company (primeiro acesso).
#   segments: all ou lista de segmentos raiz de firebase/scripts/seed_segments.js.
#   segment_variation: o que muda por segmento (labels:*, custom_fields:*, masks:*, status_labels, examples_by_segment...).
#   states: empty, error, loading, offline, retry, refresh, pagination, denied, limit, saving, unsaved, not_found.
#   feature_flags: useFinancial, useScheduling, useContracts, useDeviceManagement, fieldService (Company); nfseAvailable, nfseReady,
#          asaasEnabled (settings/payments); aiEnabled (GET /v1/app/ai/status); planLimits:*, paidPlansEnabled; kWhatsAppBotEnabled (off).
#   hardware: null ou lista (camera, gallery, file, mic, phone, maps, clipboard, share_sheet, share_intent, whatsapp, external_browser,
#          pdf_generation, push, local_notifications, native_sign_in, iap, att, qr_display, contacts).
#   data: coleções Firestore, storage:* e api:VERBO /caminho. web_status: todo | in_progress | done | excepted.
#   web_exception: null ou {status: proposed|approved, reason}. Só o Rafael aprova.
#   e2e: caminho do teste de ponta a ponta. Obrigatório com web_status: done.
#   permission: PermissionType principal (quando há). note: condição que o papel não expressa.
#   kind: action | screen | sheet | picker | flow | logic | component. logic e component não contam como capacidade de usuário.
